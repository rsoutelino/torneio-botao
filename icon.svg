<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="discGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8ecf9e"/>
      <stop offset="45%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#2a6038"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#faf6f0"/>
      <stop offset="100%" stop-color="#e4e0d8"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2e3230" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Button Disc Outer Ring -->
  <circle cx="256" cy="256" r="230" fill="url(#discGrad)" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#faf6f0" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Inner Inset Disc -->
  <circle cx="256" cy="256" r="160" fill="url(#innerGrad)" stroke="#c4c8bc" stroke-width="6"/>

  <!-- Button Soccer Stylized Star & Soccer Pattern -->
  <g fill="#4a7c59" transform="translate(256, 256) scale(1.1)">
    <!-- Pentagram Center Pattern -->
    <polygon points="0,-48 45,-15 28,39 -28,39 -45,-15"/>
    <circle cx="0" cy="0" r="16" fill="#705c30"/>
    
    <!-- Outer seams radiating from vertices -->
    <line x1="0" y1="-48" x2="0" y2="-96" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
    <line x1="45" y1="-15" x2="91" y2="-30" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
    <line x1="28" y1="39" x2="56" y2="78" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
    <line x1="-28" y1="39" x2="-56" y2="78" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
    <line x1="-45" y1="-15" x2="-91" y2="-30" stroke="#4a7c59" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
